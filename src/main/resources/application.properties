spring.application.name=backend
server.port=8080

# MySQL local (la BD induztek_db se crea sola si no existe)
spring.datasource.url=jdbc:mysql://localhost:3306/induztek_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate: crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Datos iniciales (data.sql) despues de que Hibernate crea las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true